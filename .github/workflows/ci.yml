name: CI

on:
  # UN seul déclencheur par commit. `push` (toutes les branches) couvre les branches de travail ET
  # la tête d'une PR (même SHA, le statut s'attache à la PR) ; l'ancien `pull_request` lançait un
  # second run identique pour chaque commit d'une branche ayant une PR ouverte, dans un groupe de
  # `concurrency` différent (refs/pull/N/merge ≠ refs/heads/…), donc sans annulation mutuelle.
  # Contrepartie : le résultat de la fusion avec la base n'est plus testé avant merge ; il l'est
  # par le `push` qui suit la fusion sur la branche de base.
  push:
  schedule:
    # Hebdomadaire : de nouvelles vulnérabilités sortent sans qu'aucun commit n'ait lieu.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, identique à celui du fichier checksums.txt officiel
  # de la release. Épinglé ici : la somme n'est plus téléchargée avec l'archive. À changer avec la version.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Version de Node fixée dans `.node-version` (un seul endroit). Vercel ne lit pas ce fichier.
          node-version-file: .node-version
          cache: npm
      - name: Installer les dépendances (sans scripts)
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        # Valeurs factices : le build ne contacte ni Supabase ni ball-manager-back (aucun secret en CI).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_CLUB_MANAGER_API_URL: https://api.ci.example.com
        run: npm run build
      - name: Audit des dépendances de production
        # Échoue sur une vulnérabilité haute ou critique de PRODUCTION (LOT-00).
        # Les vulnérabilités de dev sont suivies à part (docs/migration/07-tests-et-qualite.md).
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Secrets (gitleaks, historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Tout l'historique et toutes les branches : `--all` ci-dessous parcourt toutes les refs.
          fetch-depth: 0
      - name: Installer gitleaks (version épinglée, somme vérifiée avant exécution)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check -
          tar -xzf "$archive" gitleaks
      - name: Scanner l'historique
        # --redact : la valeur d'un secret n'apparaît jamais dans les logs.
        run: ./gitleaks git . --log-opts="--all" --redact=100 --no-banner --verbose
